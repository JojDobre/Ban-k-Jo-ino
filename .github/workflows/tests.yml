name: Testy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Stiahnuť Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot

      - name: Import projektu
        run: ./godot --headless --path . --import

      - name: Bisect
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./godot --path . --rendering-driver opengl3 --fixed-fps 60 res://tests/scene_smoke.tscn 2>&1 | grep -vE "ALSA|\(\?\?:0\)" | tail -30
          xvfb-run -a -s "-screen 0 1280x720x24" ./godot --path . --rendering-driver opengl3 --fixed-fps 60 res://tests/village_input.tscn 2>&1 | grep -vE "ALSA|\(\?\?:0\)" | tail -30
          ./godot --headless --path . --fixed-fps 60 res://tests/village_input.tscn 2>&1 | grep -vE "ALSA|\(\?\?:0\)" | tail -30
