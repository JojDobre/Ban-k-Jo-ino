name: Testy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Stiahnuť Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot

      - name: Import projektu
        run: ./godot --headless --path . --import

      - name: Bisect
        run: |
          ./godot --headless --path . --fixed-fps 60 res://tests/scene_smoke.tscn 2>&1 | grep -E "OBRAZOVKY|limit|SCRIPT"
          ./godot --headless --path . --fixed-fps 60 res://tests/village_input.tscn 2>&1 | grep -E "DEDINA|limit|SCRIPT|CHYBA"
